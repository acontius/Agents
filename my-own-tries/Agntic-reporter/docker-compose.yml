services:
  postgres:
    image: postgres:17
    container_name: daily-report-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_reports
      POSTGRES_USER: report_agent
      POSTGRES_PASSWORD: report_agent_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_agent -d daily_reports"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: daily-report-app
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      DATABASE_URL: postgresql+psycopg://report_agent:report_agent_password@postgres:5432/daily_reports
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
    depends_on:
      postgres:
        condition: service_healthy
    # Do NOT mount host source over /app — that overrides the image and
    # causes ModuleNotFoundError if the local tree is incomplete.
    # For local live-reload dev, uncomment:
    # volumes:
    #   - .:/app

volumes:
  postgres_data:
